name: Publish selected Penghou package family to NuGet

on:
  workflow_dispatch:
    inputs:
      family:
        description: 'Explicit package family to publish'
        type: choice
        options: [Transport, Workflow]
        default: Transport
        required: true

permissions:
  contents: read

jobs:
  validate:
    if: inputs.family == 'Transport'
    name: Validate exact transport release commit
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.release-version.outputs.package_version }}
    permissions:
      contents: read
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require the selected main commit
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Manual publication is allowed only from main; selected ref is '$env:GITHUB_REF'."
          }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -ne $env:GITHUB_SHA) {
            throw "Checked out '$checkedOutCommit', expected the dispatch commit '$env:GITHUB_SHA'."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve and require coordinated package versions
        id: release-version
        shell: pwsh
        run: |
          $modelVersion = (dotnet msbuild src/Penghou.Model.Abstractions/Penghou.Model.Abstractions.csproj -getProperty:PackageVersion -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Penghou.Model.Abstractions package version.' }
          $httpVersion = (dotnet msbuild src/Penghou.Http.Abstractions/Penghou.Http.Abstractions.csproj -getProperty:PackageVersion -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Penghou.Http.Abstractions package version.' }
          if ([string]::IsNullOrWhiteSpace($modelVersion) -or $modelVersion -ne $httpVersion) {
            throw "Transport package versions must both be set and equal; model='$modelVersion', HTTP='$httpVersion'."
          }
          "PACKAGE_VERSION=$modelVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "package_version=$modelVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build qualified solution
        run: dotnet build Penghou.IO.slnx --configuration Release

      - name: Test qualified solution on .NET 8
        run: dotnet test Penghou.IO.slnx --configuration Release --framework net8.0

      - name: Test qualified solution on .NET 10
        run: dotnet test Penghou.IO.slnx --configuration Release --framework net10.0

      - name: Pack only the two transport abstractions packages
        shell: pwsh
        run: |
          dotnet pack src/Penghou.Model.Abstractions/Penghou.Model.Abstractions.csproj --configuration Release --output transport-release-artifacts --property:PackageVersion=$env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Packing Penghou.Model.Abstractions failed.' }
          dotnet pack src/Penghou.Http.Abstractions/Penghou.Http.Abstractions.csproj --configuration Release --output transport-release-artifacts --property:PackageVersion=$env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Packing Penghou.Http.Abstractions failed.' }

      - name: Verify exact transport package set and contents
        shell: pwsh
        run: ./eng/verify-package-set.ps1 -Profile Transport -PackageDirectory ./transport-release-artifacts -PackageVersion $env:PACKAGE_VERSION

      - name: Check existing NuGet versions against validated package bytes
        shell: pwsh
        run: ./eng/check-nuget-version.ps1 -Profile Transport -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./transport-release-artifacts

      - name: Prove isolated package-only consumption
        shell: pwsh
        run: ./eng/smoke-package-consumer.ps1 -Profile Transport -PackageDirectory ./transport-release-artifacts -PackageVersion $env:PACKAGE_VERSION

      - name: Upload validated release packages
        uses: actions/upload-artifact@v6
        with:
          name: transport-release-packages-${{ github.sha }}
          path: |
            transport-release-artifacts/*.nupkg
            transport-release-artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  transport-release-check:
    if: inputs.family == 'Transport'
    name: Transport tests (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        framework: [net8.0, net10.0]
    permissions:
      contents: read
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build model and HTTP contract projects
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Penghou.Model.Abstractions/Penghou.Model.Abstractions.csproj --configuration Release --framework ${{ matrix.framework }}
          dotnet build src/Penghou.Http.Abstractions/Penghou.Http.Abstractions.csproj --configuration Release --framework ${{ matrix.framework }}

      - name: Test model and HTTP contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Penghou.Model.Tests/Penghou.Model.Tests.csproj --configuration Release --framework ${{ matrix.framework }}
          dotnet test tests/Penghou.Http.Tests/Penghou.Http.Tests.csproj --configuration Release --framework ${{ matrix.framework }}

  publish:
    name: Publish validated transport packages
    needs: [validate, transport-release-check]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require the validated commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download validated packages for this commit
        uses: actions/download-artifact@v7
        with:
          name: transport-release-packages-${{ github.sha }}
          path: transport-release-artifacts

      - name: Require exactly the two validated package artifacts
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          test "$(find transport-release-artifacts -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | wc -l)" -eq 2
          test "$(find transport-release-artifacts -maxdepth 1 -type f -name '*.snupkg' | wc -l)" -eq 2
          test -f "transport-release-artifacts/Penghou.Model.Abstractions.${PACKAGE_VERSION}.nupkg"
          test -f "transport-release-artifacts/Penghou.Model.Abstractions.${PACKAGE_VERSION}.snupkg"
          test -f "transport-release-artifacts/Penghou.Http.Abstractions.${PACKAGE_VERSION}.nupkg"
          test -f "transport-release-artifacts/Penghou.Http.Abstractions.${PACKAGE_VERSION}.snupkg"

      - name: Revalidate downloaded transport package contents
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: ./eng/verify-package-set.ps1 -Profile Transport -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./transport-release-artifacts

      - name: Recheck existing NuGet versions against these exact artifact bytes
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: ./eng/check-nuget-version.ps1 -Profile Transport -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./transport-release-artifacts

      - name: Require NuGet OIDC identity configuration
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Define secret NUGET_USER in the repository or nuget GitHub environment, and the NuGet account must trust this repository/workflow/environment as an OIDC publisher." >&2
            exit 1
          fi

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the validated packages without symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          source=https://api.nuget.org/v3/index.json
          dotnet nuget push "./transport-release-artifacts/Penghou.Model.Abstractions.${PACKAGE_VERSION}.nupkg" --source "$source" --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
          dotnet nuget push "./transport-release-artifacts/Penghou.Http.Abstractions.${PACKAGE_VERSION}.nupkg" --source "$source" --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate

      - name: Push each symbol package once
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          source=https://api.nuget.org/v3/index.json
          dotnet nuget push "./transport-release-artifacts/Penghou.Model.Abstractions.${PACKAGE_VERSION}.snupkg" --source "$source" --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "./transport-release-artifacts/Penghou.Http.Abstractions.${PACKAGE_VERSION}.snupkg" --source "$source" --api-key "$NUGET_API_KEY" --skip-duplicate

  verify-publication:
    name: Verify public transport packages after indexing
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download the same validated release artifacts
        uses: actions/download-artifact@v7
        with:
          name: transport-release-packages-${{ github.sha }}
          path: transport-release-artifacts

      - name: Verify both published package contents with one indexing deadline
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          ./eng/check-nuget-version.ps1 -Profile Transport -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./transport-release-artifacts -RequirePublished -IndexingTimeoutSeconds 3600 -RetryIntervalSeconds 30
          "Both public transport packages match the validated release artifacts for $env:GITHUB_SHA (NuGet repository signature excluded)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8


  workflow-qualify:
    if: inputs.family == 'Workflow'
    uses: ./.github/workflows/workflow-graduation.yml
    permissions:
      contents: read

  workflow-publish:
    if: inputs.family == 'Workflow'
    needs: workflow-qualify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Require selected main release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.workflow-qualify.outputs.artifact_name }}
          path: workflow-release-artifacts
      - name: Verify exact qualified package before publication
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.workflow-qualify.outputs.package_version }}
        run: |
          ./eng/verify-package-set.ps1 -Profile Workflow -PackageVersion $env:PACKAGE_VERSION -PackageDirectory workflow-release-artifacts
          ./eng/check-nuget-version.ps1 -Profile Workflow -PackageVersion $env:PACKAGE_VERSION -PackageDirectory workflow-release-artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish only exact qualified Workflow artifacts
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.workflow-qualify.outputs.package_version }}
        run: |
          set -euo pipefail
          dotnet nuget push "workflow-release-artifacts/Penghou.Workflow.Abstractions.${PACKAGE_VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
          dotnet nuget push "workflow-release-artifacts/Penghou.Workflow.Abstractions.${PACKAGE_VERSION}.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  workflow-public:
    if: inputs.family == 'Workflow'
    needs: [workflow-qualify, workflow-publish]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.workflow-qualify.outputs.artifact_name }}
          path: workflow-release-artifacts
      - name: Compare public package payload then prove fresh public consumers
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.workflow-qualify.outputs.package_version }}
        run: |
          ./eng/check-nuget-version.ps1 -Profile Workflow -PackageVersion $env:PACKAGE_VERSION -PackageDirectory workflow-release-artifacts -RequirePublished -IndexingTimeoutSeconds 3600
          $baseline = if ($env:PACKAGE_VERSION -eq '1.0.0') { '1.0.0-rc.1' } else { '0.1.0-preview.2' }
          ./eng/qualify-workflow-package.ps1 -PackageVersion $env:PACKAGE_VERSION -OutputDirectory workflow-public-evidence -BaselineVersion $baseline -PublicPackage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workflow-public-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            workflow-public-evidence/**/qualification.json
            workflow-public-evidence/**/*.log
          retention-days: 30
