name: Publish to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact release commit
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.release-version.outputs.package_version }}
    permissions:
      contents: read
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve checked-in package version
        id: release-version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Manual publication is allowed only from main; selected ref is '$env:GITHUB_REF'."
          }
          $version = (dotnet msbuild src/Penghou.Workflow.Abstractions/Penghou.Workflow.Abstractions.csproj -getProperty:PackageVersion -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the checked-in package version.' }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'The checked-in package version is empty.' }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build
        run: dotnet build Penghou.IO.slnx --configuration Release

      - name: Test Windows provider profile on .NET 8
        run: dotnet test Penghou.IO.slnx --configuration Release --framework net8.0

      - name: Test Windows provider profile on .NET 10
        run: dotnet test Penghou.IO.slnx --configuration Release --framework net10.0

      - name: Pack only the workflow abstractions release
        shell: pwsh
        run: |
          dotnet pack src/Penghou.Workflow.Abstractions/Penghou.Workflow.Abstractions.csproj --configuration Release --output artifacts --property:PackageVersion=$env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Packing Penghou.Workflow.Abstractions failed.' }

      - name: Verify workflow package identity and contents
        shell: pwsh
        run: ./eng/verify-package-set.ps1 -Profile Workflow -PackageDirectory ./artifacts -PackageVersion $env:PACKAGE_VERSION

      - name: Check existing NuGet versions against the validated package bytes
        shell: pwsh
        run: ./eng/check-nuget-version.ps1 -Profile Workflow -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./artifacts

      - name: Prove isolated package-only consumption
        shell: pwsh
        run: ./eng/smoke-package-consumer.ps1 -Profile Workflow -PackageDirectory ./artifacts -PackageVersion $env:PACKAGE_VERSION

      - name: Upload validated release packages
        uses: actions/upload-artifact@v6
        with:
          name: workflow-release-packages-${{ github.sha }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  neutral-release-check:
    name: Verify neutral projects on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and test workflow abstractions on .NET 8 and .NET 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Penghou.Workflow.Abstractions/Penghou.Workflow.Abstractions.csproj --configuration Release --framework net8.0
          dotnet test tests/Penghou.Workflow.Tests/Penghou.Workflow.Tests.csproj --configuration Release --framework net8.0
          dotnet build src/Penghou.Workflow.Abstractions/Penghou.Workflow.Abstractions.csproj --configuration Release --framework net10.0
          dotnet test tests/Penghou.Workflow.Tests/Penghou.Workflow.Tests.csproj --configuration Release --framework net10.0

  publish:
    name: Publish validated packages
    needs: [validate, neutral-release-check]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download validated packages
        uses: actions/download-artifact@v7
        with:
          name: workflow-release-packages-${{ github.sha }}
          path: artifacts

      - name: Require the exact workflow package artifact
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          test "$(find artifacts -maxdepth 1 -name '*.nupkg' ! -name '*.snupkg' | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -name '*.snupkg' | wc -l)" -eq 1
          test -f "artifacts/Penghou.Workflow.Abstractions.${PACKAGE_VERSION}.nupkg"
          test -f "artifacts/Penghou.Workflow.Abstractions.${PACKAGE_VERSION}.snupkg"

      - name: Check any existing NuGet versions against these exact validated package bytes
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: ./eng/check-nuget-version.ps1 -Profile Workflow -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./artifacts

      - name: Require NuGet OIDC identity configuration
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Define secret NUGET_USER in the repository or nuget GitHub environment, and the NuGet account must trust this repository/workflow/environment as an OIDC publisher." >&2
            exit 1
          fi

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the workflow package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          source=https://api.nuget.org/v3/index.json
          dotnet nuget push "./artifacts/Penghou.Workflow.Abstractions.${PACKAGE_VERSION}.nupkg" --source "$source" --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate

      - name: Push symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in ./artifacts/*.snupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  verify-publication:
    name: Verify public package contents after indexing
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download the same validated release artifacts
        uses: actions/download-artifact@v7
        with:
          name: workflow-release-packages-${{ github.sha }}
          path: artifacts

      - name: Verify published package bytes with a shared indexing deadline
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          ./eng/check-nuget-version.ps1 -Profile Workflow -PackageVersion $env:PACKAGE_VERSION -PackageDirectory ./artifacts -RequirePublished -IndexingTimeoutSeconds 3600 -RetryIntervalSeconds 30
          "The public workflow package matches the validated release artifact for $env:GITHUB_SHA (NuGet repository signature excluded)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
